modLoader = "javafml"
loaderVersion = "[47,)"
license = "MIT"

[[mods]]
modId = "registry_biginteger_cell"
version = "${file.jarVersion}"
displayName = "Registry BigInteger Cell"
authors = "syarukasu"
displayTest = "MATCH_VERSION"
description = '''
Adds two operator-only AE2 BigInteger test cells. One reads every registered
item, fluid, and Mekanism chemical. The other reads configured item/fluid IDs.
Every selected key is stored at the exact amount 10^64.
'''

[[dependencies.registry_biginteger_cell]]
modId = "forge"
mandatory = true
versionRange = "[47.4.18,48)"
ordering = "NONE"
side = "BOTH"

[[dependencies.registry_biginteger_cell]]
