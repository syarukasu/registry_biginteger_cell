plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
}

group = 'com.syaru.registrybigintegercell'
version = '1.1.5'

base {
    archivesName = 'registry-biginteger-cell'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
}

repositories {
    mavenCentral()
}

def localMods = file(
        providers.gradleProperty('localModsDir')
                .orElse(providers.environmentVariable('LOCAL_MODS_DIR'))
                .orElse('../../mods')
                .get())

def localMod = { String fileName ->
    def dependency = new File(localMods, fileName)
    if (!dependency.isFile()) {
        throw new GradleException(
                "Missing local mod dependency: ${dependency}. "
                        + "Set -PlocalModsDir=<path> or LOCAL_MODS_DIR.")
    }
    dependency
}

def ae2Variant = (findProperty('ae2Variant') ?: 'upstream').toString().trim().toLowerCase()
def ae2Versions = [
        upstream: '15.4.10',
        uelm: '15.5.0-uelm'
]
if (!ae2Versions.containsKey(ae2Variant)) {
    throw new GradleException("Unknown ae2Variant '${ae2Variant}'. Use 'upstream' or 'uelm'.")
}
def selectedAe2Version = ae2Versions[ae2Variant]
def localAe2 = localMod("appliedenergistics2-forge-${selectedAe2Version}.jar")

def localAco = file(
        providers.gradleProperty('acoJar')
                .orElse('../ae2-crafting-optimizer/build/libs/ae2-crafting-optimizer-1.5.5.jar')
                .get())
if (!localAco.isFile()) {
    throw new GradleException(
            "Missing ACO API dependency: ${localAco}. "
                    + "Build ACO first or set -PacoJar=<path>.")
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'

    compileOnly fg.deobf(files(
            localAe2,
            localMod('extendedae_plus-1.5.5.jar'),
            localMod('Applied-Mekanistics-1.4.3.jar'),
            localMod('Mekanism-1.20.1-10.4.16.80.jar')
    ))
    compileOnly files(localAco)

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.register('verifyAe2Profile') {
    doLast {
        logger.lifecycle("Registry BigInteger Cell AE2 profile: ${ae2Variant} (${selectedAe2Version})")
        def metadataFiles = zipTree(localAe2).matching {
            include 'META-INF/mods.toml'
        }.files
        if (metadataFiles.size() != 1) {
            throw new GradleException("Expected one META-INF/mods.toml in ${localAe2.name}")
        }

        def metadata = metadataFiles.first().getText('UTF-8')
        if (!metadata.contains('modId="ae2"')) {
            throw new GradleException("${localAe2.name} does not declare mod id ae2")
        }
        if (!metadata.contains(selectedAe2Version)) {
            throw new GradleException("${localAe2.name} does not declare AE2 version ${selectedAe2Version}")
        }
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('verifyAe2Profile')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'file': ['jarVersion': project.version]
    }
}

jar {
    // 配布JAR内のMinecraft参照を、本番環境で使われる難読化名へ必ず変換する。
    finalizedBy 'reobfJar'
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_registry_biginteger_cell' }
    }
}
